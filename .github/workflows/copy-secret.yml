name: Copy Secret To Standalone Repo
on:
  workflow_dispatch:
jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pynacl
        run: pip install pynacl
      - name: Copy WEREAD_CURL_STRING
        env:
          SRC_VALUE: ${{ secrets.WEREAD_CURL_STRING }}
          DST_TOKEN: ${{ secrets.COPY_TOKEN }}
        run: |
          python - <<'PY'
          import os, json, base64, urllib.request
          from nacl.public import PublicKey, SealedBox
          repo = 'junjuecool/weread-auto-reader'
          name = 'WEREAD_CURL_STRING'
          tok = os.environ['DST_TOKEN']
          val = os.environ['SRC_VALUE']
          def req(method, path, body=None):
              data = json.dumps(body).encode() if body is not None else None
              r = urllib.request.Request('https://api.github.com' + path, data=data, method=method)
              r.add_header('Authorization', 'Bearer ' + tok)
              r.add_header('Accept', 'application/vnd.github+json')
              r.add_header('X-GitHub-Api-Version', '2022-11-28')
              r.add_header('Content-Type', 'application/json')
              r.add_header('User-Agent', 'copy-secret')
              with urllib.request.urlopen(r, timeout=30) as resp:
                  raw = resp.read()
                  return json.loads(raw) if raw else {}
          key = req('GET', f'/repos/{repo}/actions/secrets/public-key')
          pk = PublicKey(base64.b64decode(key['key']))
          enc = base64.b64encode(SealedBox(pk).encrypt(val.encode())).decode('ascii')
          req('PUT', f'/repos/{repo}/actions/secrets/{name}', {'encrypted_value': enc, 'key_id': key['key_id']})
          print('copied length', len(val))
          PY
